
name: Check SearchByLens Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get Railway Sync Errors
        env:
          ADMIN_KEY: ${{ secrets.RAILWAY_ADMIN_API_KEY }}
        run: |
          curl --fail-with-body -sS \
            --max-time 30 \
            -H "Authorization: Bearer $ADMIN_KEY" \
            https://search.stitchpartner.com/sync/status \
            -o /tmp/sync.json

          python3 - <<'PY'
          import json
          import re

          with open("/tmp/sync.json") as f:
              data = json.load(f)

          print("Sync running:", data.get("running"))
          print("Indexed products:", data.get("indexed_products"))
          print("Indexed images:", data.get("indexed_images"))
          print("Last sync:", data.get("last_sync_at"))

          report = data.get("last_report")

          if not report:
              print("No sync report available in this process.")
          else:
              for key in (
                  "status",
                  "products_found",
                  "new_products",
                  "updated_products",
                  "embeddings_generated",
                  "images_skipped",
                  "error_count",
              ):
                  print(f"{key}: {report.get(key)}")

              print("\nFIRST 10 ERRORS:")
              for error in report.get("errors", [])[:10]:
                  message = str(error)
                  message = re.sub(
                      r"https?://\S+", "[URL]", message
                  )
                  message = re.sub(
                      r"(?i)(key|token|secret|password)=[^&\s]+",
                      r"\1=[REDACTED]", message
                  )
                  print(message[:300])
          PY
